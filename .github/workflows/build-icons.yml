name: Build PWA Icons
on:
  push:
    branches: [main]
    paths:
      - "icons/crossscan.svg"
      - ".github/workflows/build-icons.yml"
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PWA icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 192 -h 192 icons/crossscan.svg -o icons/icon-192.png
          rsvg-convert -w 512 -h 512 icons/crossscan.svg -o icons/icon-512.png
          cp icons/icon-512.png icons/icon-maskable-512.png
          test -s icons/icon-192.png
          test -s icons/icon-512.png
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build installable PWA icons"
          git pull --rebase origin main
          git push
