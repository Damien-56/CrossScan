name: Vendor QRCode
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned QRCode library
        run: |
          mkdir -p vendor
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js -o vendor/qrcode-generator.min.js
          test -s vendor/qrcode-generator.min.js
      - name: Commit vendor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/qrcode-generator.min.js
          git diff --cached --quiet || git commit -m "Vendor qrcode-generator 1.4.4 for offline print documents"
          git push
