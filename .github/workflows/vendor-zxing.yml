name: Vendor ZXing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-zxing.yml"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned ZXing browser
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 "https://unpkg.com/@zxing/browser@0.1.1/umd/zxing-browser.min.js" -o vendor/zxing-browser.min.js
          test -s vendor/zxing-browser.min.js
      - name: Commit vendored library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/zxing-browser.min.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor ZXing 0.1.1 for offline use"
          git push
