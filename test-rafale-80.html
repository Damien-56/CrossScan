<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17212b"><title>CrossScan • Test rafale 001–080</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eef1f3;color:#17212b}.top{padding:10px 14px;background:#17212b;color:#fff;display:flex;gap:12px;align-items:center;justify-content:space-between}.top b{font-size:18px}.stage{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:12px}.panel{width:min(96vw,760px);text-align:center}.qrbox{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 24px #0002}.num{font-size:clamp(34px,8vw,64px);font-weight:950;letter-spacing:3px}.qr{width:min(66vh,72vw,520px);height:min(66vh,72vw,520px);margin:4px auto}.qr svg{width:100%;height:100%;display:block}.meta{font-weight:800;font-size:18px}.bar{height:8px;background:#dce2e6;border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#17212b;width:0}.controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:10px;padding:11px 15px;background:#17212b;color:#fff;font-weight:850;font-size:15px}.secondary{background:#dfe4e7;color:#17212b}.ready{font-size:clamp(24px,5vw,42px);font-weight:900;padding:50px 10px}.note{font-size:12px;color:#66717b;margin-top:8px}@media(orientation:portrait){.qr{width:min(76vw,54vh);height:min(76vw,54vh)}}</style></head><body><div class="top"><div><b>CrossScan • simulation arrivée massive</b><div style="font-size:11px;opacity:.75">QR officiels CROSS-001 à CROSS-080 • générateur CrossScan</div></div><div id="counter">0 / 80</div></div><main class="stage"><div class="panel"><div id="ready" class="qrbox ready">Test prêt<div class="note">80 arrivées • rythme variable • rafales incluses</div></div><div id="card" class="qrbox" hidden><div class="num" id="num">001</div><div class="qr" id="qr"></div><div class="meta" id="timing"></div><div class="bar"><i id="progress"></i></div></div><div class="controls"><button id="start" onclick="startTest()">▶ Démarrer</button><button class="secondary" onclick="pauseTest()">⏸ Pause</button><button class="secondary" onclick="restartTest()">↺ Recommencer</button><button class="secondary" onclick="toggleFull()">⛶ Plein écran</button></div><div class="note">Chaque écran ne contient qu’un seul QR. Le changement automatique simule le passage du coureur suivant.</div></div></main><script src="./vendor/qrcode-generator.min.js"></script><script>
// Profil figé et reproductible, en millisecondes. Alternance passages espacés, rythme normal et rafales.
const gaps=[2200,1700,1200,900,700,1500,800,650,500,2400,1100,750,600,450,1300,900,700,550,400,1900,
1000,800,600,450,350,1200,700,500,400,300,1800,900,650,450,350,1400,750,550,400,320,
2100,1000,700,500,380,1250,650,450,350,300,1700,850,600,420,320,1150,600,430,330,280,
2000,900,650,480,360,1300,700,500,380,300,1600,800,550,400,300,1100,600,450,350,1200];
let idx=-1,timer=null,paused=false,deadline=0,remaining=0,raf=0;
function svgQR(data,size=420){let q=qrcode(0,'M');q.addData(data);q.make();let n=q.getModuleCount(),cell=size/n,s='<svg viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="'+size+'" height="'+size+'" fill="white"/>';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))s+='<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+(cell+.03)+'" height="'+(cell+.03)+'" fill="black"/>';return s+'</svg>'}
function show(i){idx=i;if(i>=80){finish();return}ready.hidden=true;card.hidden=false;let n=String(i+1).padStart(3,'0');num.textContent=n;qr.innerHTML=svgQR('CROSS-'+n);counter.textContent=(i+1)+' / 80';remaining=gaps[i];timing.textContent='Prochain coureur dans '+(remaining/1000).toFixed(2)+' s';schedule(remaining)}
function schedule(ms){clearTimeout(timer);cancelAnimationFrame(raf);deadline=performance.now()+ms;timer=setTimeout(()=>show(idx+1),ms);tick()}
function tick(){let left=Math.max(0,deadline-performance.now()),total=gaps[idx]||1;progress.style.width=(100-left/total)*100+'%';if(left>0&&!paused)raf=requestAnimationFrame(tick)}
function startTest(){paused=false;show(0)}
function pauseTest(){if(idx<0||idx>=80)return;if(!paused){paused=true;remaining=Math.max(0,deadline-performance.now());clearTimeout(timer);cancelAnimationFrame(raf);timing.textContent='PAUSE • '+(remaining/1000).toFixed(2)+' s restantes'}else{paused=false;schedule(remaining)}}
function restartTest(){clearTimeout(timer);cancelAnimationFrame(raf);paused=false;idx=-1;card.hidden=true;ready.hidden=false;counter.textContent='0 / 80';ready.innerHTML='Test prêt<div class="note">80 arrivées • rythme variable • rafales incluses</div>'}
function finish(){clearTimeout(timer);cancelAnimationFrame(raf);card.hidden=true;ready.hidden=false;ready.innerHTML='✓ 80 arrivées terminées<div class="note">Comparez le classement CrossScan avec la séquence 001 → 080.</div>';counter.textContent='80 / 80'}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
</script></body></html>
